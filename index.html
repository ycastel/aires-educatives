<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Aires éducatives — Académie de Nice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Segoe UI, Arial; }
#map { height:100vh; }
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// =======================
// INITIALISATION CARTE
// =======================
var map = L.map('map').setView([43.8, 6.3], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap'
}).addTo(map);

// =======================
// LECTURE CSV
// =======================
fetch("https://ycastel.github.io/aires-educatives/donnees.csv")
.then(response => response.text())
.then(function(text){
    var lignes = text.split("\n");

    for(var i=1; i<lignes.length; i++){
        if(!lignes[i]) continue;

        var cols = lignes[i].split(";");
        if(cols.length < 9) continue;

        var nom = cols[0];
        var adresse = cols[1];
        var cp = cols[2];
        var commune = cols[3];
        var ame = cols[4];
        var ate = cols[5];
        var site = cols[6];
        var lon = parseFloat(cols[7].replace(",", "."));
        var lat = parseFloat(cols[8].replace(",", "."));

        if(isNaN(lat) || isNaN(lon)) continue;

        var popup =
            "<b>"+nom+"</b><br>"+
            adresse+"<br>"+
            cp+" "+commune+"<br>"+
            (site ? "<a href='"+site+"' target='_blank'>Site web</a>" : "");

        var marker = L.circleMarker([lat, lon], {
            radius:6,
            fillColor:"#007bff",
            color:"white",
            weight:1,
            fillOpacity:0.9
        });

        marker.bindPopup(popup);
        marker.addTo(map);
    }
});
</script>

</body>
</html>
