<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Carte des Aires éducatives</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
}

#map {
    width: 100%;
    height: 100vh;
}

.legend {
    background: white;
    padding: 10px;
    line-height: 1.5;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

// URL de TON CSV
const CSV_URL = "https://ycastel.github.io/aires-educatives/donnees.csv";

// Carte
const map = L.map('map');

// Fond satellite par défaut
const satellite = L.tileLayer(
'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
{
    attribution: '© OpenTopoMap'
}).addTo(map);

// Relief
const relief = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution: '© OpenStreetMap'
});

// Contrôle des couches
L.control.layers({
    "Satellite": satellite,
    "Relief": relief
}).addTo(map);

// Cluster
const markers = L.markerClusterGroup();
map.addLayer(markers);

// Charger CSV
fetch(CSV_URL)
.then(response => response.text())
.then(text => {

    const lignes = text.split('\n');

    // Ignorer l'en-tête
    for (let i = 1; i < lignes.length; i++) {

        const cols = lignes[i].split(';');

        const nom = cols[0];
        const commune = cols[1];
        const type = cols[2];
        const lat = parseFloat(cols[3]);
        const lon = parseFloat(cols[4]);

        if (!isNaN(lat) && !isNaN(lon)) {

            const marker = L.marker([lat, lon]);

            marker.bindPopup(
                "<b>" + nom + "</b><br>" +
                commune + "<br>" +
                type
            );

            markers.addLayer(marker);
        }
    }

    map.fitBounds(markers.getBounds());

});

</script>

</body>
</html>
