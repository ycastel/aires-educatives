<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Aires éducatives</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

// carte satellite par défaut
var satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{ attribution:'© Esri' });

var relief = L.tileLayer(
'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
{ attribution:'© OpenTopoMap' });

var map = L.map('map',{
center:[43.8,6.3],
zoom:8,
layers:[satellite]
});

L.control.layers({
"Satellite": satellite,
"Relief": relief
}).addTo(map);


// cluster
var cluster = L.markerClusterGroup();

fetch("https://ycastel.github.io/aires-educatives/donnees.csv")

.then(response => response.text())

.then(function(text){

var lignes = text.split("\n");

for(var i=1; i<lignes.length; i++){

if(!lignes[i]) continue;

var cols = lignes[i].split(";");

var nom = cols[0];
var adresse = cols[1];
var cp = cols[2];
var commune = cols[3];
var site = cols[6];

// IMPORTANT : ordre correct selon ton CSV
var lon = parseFloat(cols[7].replace(",", "."));
var lat = parseFloat(cols[8].replace(",", "."));

if(isNaN(lat) || isNaN(lon)) continue;

var marker = L.circleMarker([lat, lon],{
radius:8,
fillColor:"#007bff",
color:"white",
weight:1,
fillOpacity:0.9
});

marker.bindPopup(
"<b>"+nom+"</b><br>"+
adresse+"<br>"+
cp+" "+commune+"<br>"+
(site ? "<a href='"+site+"' target='_blank'>Site web</a>" : "")
);

cluster.addLayer(marker);

}

map.addLayer(cluster);

});

</script>

</body>
</html>
