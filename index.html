<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Aires éducatives</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([43.8,6.3],8);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);


fetch("https://ycastel.github.io/aires-educatives/donnees.csv")

.then(r => r.text())

.then(function(text){

console.log(text); // DEBUG

var lignes = text.split(/\r?\n/);

for(var i=1;i<lignes.length;i++){

if(!lignes[i]) continue;

var cols = lignes[i].split(";");

if(cols.length < 9) {
console.log("ligne ignorée:", lignes[i]);
continue;
}

// nettoie valeurs
var lon = cols[7].trim().replace(",",".").replace('"',"");
var lat = cols[8].trim().replace(",",".").replace('"',"");

lon = parseFloat(lon);
lat = parseFloat(lat);

console.log("coord:", lat, lon);

if(isNaN(lat) || isNaN(lon)) continue;

L.marker([lat, lon])
.addTo(map)
.bindPopup(cols[0]);

}

});

</script>

</body>
</html>
